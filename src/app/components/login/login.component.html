<div class="min-h-screen flex items-center justify-center bg-[var(--b1)] py-12 px-4 sm:px-6 lg:px-8 text-[var(--bc)] relative overflow-hidden">
  <!-- Decorative background glows -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full space-y-8 p-8 rounded-3xl border border-[var(--b3)] bg-[var(--b2)]/90 backdrop-blur-xl shadow-2xl relative z-10">
    <div class="text-center space-y-3">
      <div class="inline-flex items-center justify-center p-3 bg-white/95 rounded-2xl shadow-xl border border-slate-200/50 mx-auto">
        <img src="ConsultNowDesign.png" alt="ConsultNow Design" class="h-16 w-auto object-contain" width="64" height="64">
      </div>
      <h2 class="text-3xl font-extrabold text-white tracking-tight">Welcome Back</h2>
      <p class="text-xs text-[var(--bc)]/70">Sign in to manage your expert profile & consultation schedules.</p>
    </div>

    <!-- Form -->
    <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div *ngIf="errorMessage" class="bg-red-950/60 border border-red-500/50 text-red-200 p-3.5 rounded-xl text-xs flex items-center gap-2" role="alert" aria-live="assertive">
        <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="space-y-4">
        <div>
          <label for="email-address" class="block text-xs font-semibold text-[var(--bc)]/80 mb-1.5">Email Address</label>
          <input 
            id="email-address" 
            type="email" 
            formControlName="email" 
            required 
            class="stripe-input w-full px-4 py-3 rounded-xl text-sm" 
            placeholder="name@example.com"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-semibold text-[var(--bc)]/80">Password</label>
            <a routerLink="/reset-password" class="text-xs font-medium text-blue-400 hover:underline">
              Forgot Password?
            </a>
          </div>
          <div class="relative">
            <input 
              id="password" 
              [type]="showPassword ? 'text' : 'password'" 
              formControlName="password" 
              required 
              class="stripe-input w-full px-4 py-3 pr-10 rounded-xl text-sm" 
              placeholder="••••••••"
            />
            <button 
              type="button" 
              (click)="togglePasswordVisibility()" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white cursor-pointer">
              <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showPassword" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 013.682-.783c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div>
        <button 
          type="submit" 
          [disabled]="!loginForm.valid || loading" 
          class="glow-btn-primary w-full flex justify-center items-center gap-2 py-3 px-4 text-sm font-semibold rounded-xl text-white disabled:opacity-50 transition-all cursor-pointer">
          <span *ngIf="loading" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
          Sign In
        </button>
      </div>
      
      <div class="text-xs text-center text-[var(--bc)]/60 pt-2">
        Don't have an account? 
        <a routerLink="/register" class="font-bold text-blue-400 hover:underline">
          Register as Expert
        </a>
      </div>
    </form>
  </div>
</div>
