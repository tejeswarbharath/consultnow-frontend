<div class="min-h-screen flex items-center justify-center bg-[var(--b1)] py-12 px-4 sm:px-6 lg:px-8 text-[var(--bc)]">
  <div class="max-w-md w-full space-y-8 p-8 rounded-2xl border border-[var(--b3)] bg-[var(--b2)] shadow-2xl">
    <div class="text-center">
      <div class="inline-flex items-center justify-center p-3 bg-white/95 rounded-2xl shadow-lg border border-slate-200/50 mx-auto mb-4">
        <img src="ConsultNowDesign.png" alt="ConsultNow Design" class="h-20 w-auto object-contain" width="80" height="80">
      </div>
      <h2 class="mt-6 text-center text-4xl font-extrabold text-white">Reset Password</h2>
      <p class="mt-2 text-sm text-[var(--bc)]/60">Enter your registered expert email and choose a new password.</p>
    </div>
    
    <form class="mt-8 space-y-6" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      
      <div *ngIf="errorMessage" class="bg-red-950/40 border border-red-500 text-red-200 p-4 rounded-md text-sm" role="alert" aria-live="assertive">
        <p>{{ errorMessage }}</p>
      </div>

      <div *ngIf="successMessage" class="bg-emerald-950/40 border border-emerald-500 text-emerald-200 p-4 rounded-md text-sm" role="alert">
        <p class="font-semibold">{{ successMessage }}</p>
        <div class="mt-3">
          <a routerLink="/login" class="inline-block text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-3 rounded transition">
            Return to Sign In
          </a>
        </div>
      </div>

      <div class="rounded-md space-y-4">
        <div>
          <label for="reset-email" class="block text-sm font-medium text-[var(--bc)]/80 mb-1">Expert Email Address</label>
          <input id="reset-email" type="email" formControlName="email" required 
            class="stripe-input w-full px-3 py-3 rounded-md text-sm" placeholder="Enter your registered email">
          <div *ngIf="resetForm.get('email')?.touched && resetForm.get('email')?.errors?.['email']" class="text-xs text-red-400 mt-1">
            Please enter a valid email address.
          </div>
        </div>

        <div>
          <label for="new-password" class="block text-sm font-medium text-[var(--bc)]/80 mb-1">New Password</label>
          <input id="new-password" type="password" formControlName="newPassword" required 
            class="stripe-input w-full px-3 py-3 rounded-md text-sm" placeholder="At least 6 characters">
          <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.errors?.['minlength']" class="text-xs text-red-400 mt-1">
            Password must be at least 6 characters long.
          </div>
        </div>

        <div>
          <label for="confirm-password" class="block text-sm font-medium text-[var(--bc)]/80 mb-1">Confirm New Password</label>
          <input id="confirm-password" type="password" formControlName="confirmPassword" required 
            class="stripe-input w-full px-3 py-3 rounded-md text-sm" placeholder="Re-enter new password">
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="!resetForm.valid || isSubmitting" 
          class="glow-btn-primary w-full flex justify-center py-3 px-4 text-base font-semibold rounded-md text-white disabled:opacity-50 disabled:cursor-not-allowed transition duration-150 ease-in-out cursor-pointer">
          <span *ngIf="!isSubmitting">Update Password</span>
          <span *ngIf="isSubmitting">Updating...</span>
        </button>
      </div>
      
      <div class="text-sm text-center">
        <a routerLink="/login" class="font-medium text-blue-400 hover:text-blue-300 transition duration-150 ease-in-out">
          &larr; Return to Sign In
        </a>
      </div>
    </form>
  </div>
</div>
