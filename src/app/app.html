<div class="min-h-screen flex flex-col bg-[var(--b1)] text-[var(--bc)] relative overflow-x-hidden">
  <!-- Toast Notification Container -->
  <app-toast></app-toast>

  <!-- Header Navigation -->
  <header class="bg-[var(--b2)]/80 backdrop-blur-xl border-b border-[var(--b3)] sticky top-0 z-50 py-3.5 px-4 sm:px-8 lg:px-12 transition-all">
    <nav class="max-w-7xl mx-auto flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <div routerLink="/" (click)="closeMobileMenu()" class="group flex items-center gap-2.5 cursor-pointer">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-purple-500 p-0.5 shadow-lg group-hover:scale-105 transition-all">
            <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center font-extrabold text-lg text-white">
              C<span class="text-blue-400">N</span>
            </div>
          </div>
          <span class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-blue-300 bg-clip-text text-transparent">
            Consult<span class="text-blue-500">Now</span>
          </span>
        </div>
      </div>

      <!-- Desktop Nav Links -->
      <div class="hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium">
        <a routerLink="/" 
           routerLinkActive="bg-blue-500/10 text-blue-400 border-blue-500/30" 
           [routerLinkActiveOptions]="{exact: true}"
           class="px-4 py-2 rounded-xl text-[var(--bc)]/80 hover:text-white hover:bg-slate-800/40 transition-all border border-transparent">
          Find Experts
        </a>
        <a routerLink="/affiliate" 
           routerLinkActive="bg-blue-500/10 text-blue-400 border-blue-500/30"
           class="px-4 py-2 rounded-xl text-[var(--bc)]/80 hover:text-white hover:bg-slate-800/40 transition-all border border-transparent">
          Affiliate Hub
        </a>
        <a routerLink="/dashboard" 
           routerLinkActive="bg-blue-500/10 text-blue-400 border-blue-500/30"
           class="px-4 py-2 rounded-xl text-[var(--bc)]/80 hover:text-white hover:bg-slate-800/40 transition-all border border-transparent">
          Expert Area
        </a>
        
        <!-- Action Buttons -->
        <a routerLink="/login" 
           class="ml-2 glow-btn-primary text-white font-semibold py-2 px-5 rounded-xl transition-all text-xs flex items-center gap-1.5 shadow-md">
           <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
           </svg>
           Sign In
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <button 
        (click)="toggleMobileMenu()" 
        class="md:hidden p-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 focus:outline-none cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path *ngIf="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          <path *ngIf="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </nav>

    <!-- Mobile Drawer Menu -->
    <div *ngIf="mobileMenuOpen" class="md:hidden pt-4 pb-3 border-t border-[var(--b3)] mt-3 space-y-2 animate-fade-in">
      <a routerLink="/" 
         (click)="closeMobileMenu()"
         routerLinkActive="bg-blue-500/10 text-blue-400 font-bold" 
         [routerLinkActiveOptions]="{exact: true}"
         class="block px-4 py-2.5 rounded-xl text-sm text-[var(--bc)] hover:bg-slate-800/50">
        Find Experts
      </a>
      <a routerLink="/affiliate" 
         (click)="closeMobileMenu()"
         routerLinkActive="bg-blue-500/10 text-blue-400 font-bold"
         class="block px-4 py-2.5 rounded-xl text-sm text-[var(--bc)] hover:bg-slate-800/50">
        Affiliate Hub
      </a>
      <a routerLink="/dashboard" 
         (click)="closeMobileMenu()"
         routerLinkActive="bg-blue-500/10 text-blue-400 font-bold"
         class="block px-4 py-2.5 rounded-xl text-sm text-[var(--bc)] hover:bg-slate-800/50">
        Expert Area
      </a>
      <a routerLink="/login" 
         (click)="closeMobileMenu()"
         class="block px-4 py-2.5 rounded-xl text-sm font-bold text-center bg-blue-600 text-white shadow-md">
        Sign In
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-[var(--b3)] text-[var(--bc)]/60 py-8 px-6 md:px-10 lg:px-16 text-xs">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="font-bold text-white">ConsultNow</span>
        <span>&copy; 2026. All rights reserved.</span>
      </div>
      <div class="flex items-center space-x-6">
        <a href="mailto:support@consultnow.in" class="hover:text-white transition-colors">Support</a>
        <a routerLink="/privacy" class="hover:text-white transition-colors">Privacy Policy</a>
        <a routerLink="/terms" class="hover:text-white transition-colors">Terms of Service</a>
      </div>
    </div>
  </footer>
</div>
